name: ICM Codex context audit

on:
  push:
    branches:
      - icm-codex-context-wave-2

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: icm-codex-context-wave-2
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install branch dependencies
        run: bun install --frozen-lockfile

      - name: Render ICM Codex skills
        run: |
          rm -rf /tmp/gstack-icm-render
          bun run scripts/gen-skill-docs.ts --host codex --out-dir /tmp/gstack-icm-render > /tmp/icm-gen.log

      - name: Render baseline main Codex skills
        run: |
          rm -rf /tmp/gstack-main /tmp/gstack-main-render
          git worktree add --detach /tmp/gstack-main origin/main
          cd /tmp/gstack-main
          bun install --frozen-lockfile
          bun run scripts/gen-skill-docs.ts --host codex --out-dir /tmp/gstack-main-render > /tmp/main-gen.log

      - name: Build context report
        run: |
          mkdir -p docs/icm
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone

          base_root = Path('/tmp/gstack-main-render/.agents/skills')
          icm_root = Path('/tmp/gstack-icm-render/.agents/skills')

          def collect(root):
              out = {}
              if not root.exists():
                  return out
              for skill in root.iterdir():
                  p = skill / 'SKILL.md'
                  if p.is_file():
                      out[skill.name] = {
                          'bytes': p.stat().st_size,
                          'sections': sum(1 for x in (skill / 'sections').glob('*.md')) if (skill / 'sections').exists() else 0,
                      }
              return out

          base = collect(base_root)
          icm = collect(icm_root)
          names = sorted(set(base) | set(icm))
          rows = []
          for name in names:
              b = base.get(name, {}).get('bytes', 0)
              n = icm.get(name, {}).get('bytes', 0)
              sections = icm.get(name, {}).get('sections', 0)
              saved = b - n
              pct = (saved / b * 100) if b else 0
              rows.append((name, b, n, saved, pct, sections))

          rows_by_saving = sorted(rows, key=lambda r: r[3], reverse=True)
          rows_by_icm = sorted(rows, key=lambda r: r[2], reverse=True)
          total_b = sum(r[1] for r in rows)
          total_n = sum(r[2] for r in rows)
          total_saved = total_b - total_n
          total_pct = total_saved / total_b * 100 if total_b else 0

          def tok(n):
              return round(n / 4)

          lines = []
          lines.append('# Codex ICM Context Audit')
          lines.append('')
          lines.append(f'Generated: {datetime.now(timezone.utc).isoformat()}')
          lines.append('')
          lines.append('This compares the generated Codex SKILL.md payload on fork main with the ICM progressive-section branch. Approximate tokens use 4 bytes per token. Section files are excluded from initial context because the ICM branch loads them only when their phase fires.')
          lines.append('')
          lines.append('## Corpus result')
          lines.append('')
          lines.append(f'- Baseline initial SKILL.md bytes: {total_b:,} (~{tok(total_b):,} tokens)')
          lines.append(f'- ICM initial SKILL.md bytes: {total_n:,} (~{tok(total_n):,} tokens)')
          lines.append(f'- Removed from eager Codex context: {total_saved:,} bytes (~{tok(total_saved):,} tokens, {total_pct:.1f}%)')
          lines.append('')
          lines.append('## Biggest savings from progressive loading')
          lines.append('')
          lines.append('| Skill | Baseline tokens | ICM tokens | Tokens deferred | Saving | Sections |')
          lines.append('| --- | ---: | ---: | ---: | ---: | ---: |')
          for name,b,n,s,pct,sections in rows_by_saving[:25]:
              if s <= 0: continue
              lines.append(f'| {name} | {tok(b):,} | {tok(n):,} | {tok(s):,} | {pct:.1f}% | {sections} |')
          lines.append('')
          lines.append('## Largest remaining initial Codex skills')
          lines.append('')
          lines.append('| Skill | ICM tokens | ICM bytes | Sections |')
          lines.append('| --- | ---: | ---: | ---: |')
          for name,b,n,s,pct,sections in rows_by_icm[:30]:
              lines.append(f'| {name} | {tok(n):,} | {n:,} | {sections} |')
          lines.append('')
          lines.append('## Full comparison')
          lines.append('')
          lines.append('| Skill | Baseline tokens | ICM tokens | Deferred | Saving | Sections |')
          lines.append('| --- | ---: | ---: | ---: | ---: | ---: |')
          for name,b,n,s,pct,sections in sorted(rows):
              lines.append(f'| {name} | {tok(b):,} | {tok(n):,} | {tok(s):,} | {pct:.1f}% | {sections} |')
          lines.append('')
          lines.append('## Wave 2 selection rule')
          lines.append('')
          lines.append('Prioritize large remaining eager skills where content is branch-exclusive, late-phase, optional, or reference material. Keep safety gates, dispatch rules, destructive-action checks, scope gates, and decision rules in the always-loaded skeleton.')
          lines.append('')
          Path('docs/icm/CODEX_CONTEXT_AUDIT.md').write_text('\n'.join(lines) + '\n')
          PY
          cat docs/icm/CODEX_CONTEXT_AUDIT.md

      - name: Remove one-shot workflow
        run: rm .github/workflows/icm-codex-context-audit.yml

      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: audit Codex context after progressive loading"
          git push origin HEAD:icm-codex-context-wave-2
