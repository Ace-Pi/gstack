name: ICM Design Review Carve

on:
  push:
    branches: [icm-codex-context-wave-2]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: icm-codex-context-wave-2
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun scripts/apply-icm-design-review-carve.ts
      - run: bun test test/design-review-progressive-sections.test.ts
      - run: bun test test/parity-sectioned.test.ts
      - run: bun run scripts/gen-skill-docs.ts --host codex --out-dir /tmp/gstack-wave2
      - run: wc -c /tmp/gstack-wave2/.agents/skills/gstack-design-review/SKILL.md /tmp/gstack-wave2/.agents/skills/gstack-design-review/sections/baseline-methodology.md
      - run: rm .github/workflows/icm-design-review-carve.yml scripts/apply-icm-design-review-carve.ts
      - run: |
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(design-review): defer baseline methodology in Codex'
          git push origin HEAD:icm-codex-context-wave-2
