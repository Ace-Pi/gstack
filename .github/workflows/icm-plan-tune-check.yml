name: ICM Plan Tune Check

on:
  push:
    branches:
      - icm-codex-context-wave-2

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: icm-codex-context-wave-2
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun scripts/apply-icm-plan-tune-carve.ts
      - run: bun test test/plan-tune-progressive-sections.test.ts
      - run: bun test test/devex-review-progressive-sections.test.ts
      - run: bun test test/design-review-progressive-sections.test.ts
      - run: bun test test/parity-sectioned.test.ts
      - run: bun run scripts/gen-skill-docs.ts --host codex --out-dir /tmp/gstack-wave2
      - run: wc -c /tmp/gstack-wave2/.agents/skills/gstack-plan-tune/SKILL.md /tmp/gstack-wave2/.agents/skills/gstack-plan-tune/sections/*.md
      - run: rm .github/workflows/icm-plan-tune-check.yml scripts/apply-icm-plan-tune-carve.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(plan-tune): load routed flows progressively in Codex"
          git push origin HEAD:icm-codex-context-wave-2
