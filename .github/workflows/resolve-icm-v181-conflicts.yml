name: Resolve ICM v1.81 conflicts

on:
  push:
    branches: [icm-codex-context-wave-2]
    paths:
      - scripts/resolve-icm-v181-merge.ts
      - .github/workflows/resolve-icm-v181-conflicts.yml

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: icm-codex-context-wave-2
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Save ICM carve registry
        run: cp test/helpers/carve-guards.ts /tmp/icm-carve-guards.ts

      - name: Merge v1.81 main without committing
        shell: bash
        run: |
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "Expected merge conflicts. Resolving with the ICM port script."
          fi

      - name: Resolve v1.81 conflicts and port ICM guards
        run: bun scripts/resolve-icm-v181-merge.ts /tmp/icm-carve-guards.ts

      - name: Mark resolved files
        run: |
          git add devex-review/SKILL.md.tmpl devex-review/sections/audit-playbook.md.tmpl test/helpers/carve-guards.ts
          if git diff --name-only --diff-filter=U | grep .; then
            echo "Unresolved merge conflicts remain"
            exit 1
          fi

      - name: Run ICM progressive-loading regressions
        shell: bash
        run: |
          bun test test/devex-review-progressive-sections.test.ts
          bun test test/design-review-progressive-sections.test.ts
          bun test test/qa-only-progressive-sections.test.ts
          bun test test/plan-tune-progressive-sections.test.ts
          bun test test/document-generate-progressive-sections.test.ts
          bun test test/pair-agent-progressive-sections.test.ts
          bun test test/retro-progressive-sections.test.ts
          bun test test/plan-ceo-review-progressive-sections.test.ts
          bun test test/ship-conditional-progressive-sections.test.ts
          bun test test/parity-sectioned.test.ts

      - name: Generate Codex skills on merged v1.81 tree
        run: bun run scripts/gen-skill-docs.ts --host codex --out-dir /tmp/gstack-v181-icm

      - name: Remove one-shot resolver files
        run: |
          rm .github/workflows/resolve-icm-v181-conflicts.yml
          rm scripts/resolve-icm-v181-merge.ts

      - name: Commit resolved merge
        shell: bash
        run: |
          git add -A
          git commit -m "merge: port Codex ICM context loading onto gstack v1.81"
          git push origin HEAD:icm-codex-context-wave-2
