name: Apply ICM Codex progressive context

on:
  push:
    branches:
      - icm-codex-progressive-context

permissions:
  contents: write

jobs:
  apply-test-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: icm-codex-progressive-context
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Apply exact ICM patch
        run: |
          git apply --check .icm-codex-progressive-context.patch
          git apply .icm-codex-progressive-context.patch

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run focused progressive-loading test
        run: bun test test/codex-progressive-sections.test.ts

      - name: Remove one-shot staging files
        run: |
          rm .icm-codex-progressive-context.patch
          rm .github/workflows/icm-codex-progressive-context.yml

      - name: Commit tested implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: load gstack sections progressively in Codex"
          git push origin HEAD:icm-codex-progressive-context
