name: Apply ICM Codex progressive context

on:
  push:
    branches:
      - icm-codex-progressive-context

permissions:
  contents: write

jobs:
  apply-test-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: icm-codex-progressive-context
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Apply exact source transformations
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('scripts/resolvers/sections.ts')
          s = p.read_text()
          s = s.replace(
          ''' * Section resolvers (v2 plan T9, Claude-first carve).''',
          ''' * Section resolvers (v2 plan T9, progressive carve).''')
          s = s.replace(
          ''' *  - On every OTHER host: {{SECTION:id}} INLINES the section template's content,
           *    so external hosts keep the full monolith ship skill (no section files, no
           *    host-portable-path problem). Inlined content keeps its own {{RESOLVER}}
           *    tokens, which the generator's multi-pass resolve expands.''',
          ''' *  - On CODEX: {{SECTION:id}} emits a STOP-cat pointer to the generated Codex
           *    section file. Setup installs generated Codex skill directories with their
           *    runtime assets, so the section is available globally and in-repo.
           *  - On every OTHER host: {{SECTION:id}} INLINES the section template's content.
           *    Inlined content keeps its own {{RESOLVER}} tokens, which the generator's
           *    multi-pass resolve expands.''')
          s = s.replace(
          ''' * manifest on Claude (empty on other hosts — they have no sections). The manifest
           * is the single source of id/file/title/trigger text (CM2; v2_PLAN.md:663).''',
          ''' * manifest on progressive hosts (empty on inline hosts). The manifest is the
           * single source of id/file/title/trigger text (CM2; v2_PLAN.md:663).''')
          needle = '''function findSection(skill: string, id: string): SectionEntry {
            const entry = loadManifest(skill).sections.find(s => s.id === id);
            if (!entry) {
              throw new Error(`{{SECTION:${id}}} — no section "${id}" in ${skill}/sections/manifest.json`);
            }
            return entry;
          }
          '''
          insert = needle + '''
          function isProgressiveSectionHost(ctx: TemplateContext): boolean {
            return ctx.host === 'claude' || ctx.host === 'codex';
          }

          function codexSkillDir(skillName: string): string {
            return skillName.startsWith('gstack-') ? skillName : `gstack-${skillName}`;
          }
          '''
          if needle not in s:
              raise SystemExit('findSection anchor missing')
          s = s.replace(needle, insert, 1)
          s = s.replace(
          ''' * {{SECTION:id}} — pointer on Claude, inline on other hosts.''',
          ''' * {{SECTION:id}} — pointer on progressive hosts, inline on other hosts.''')
          old = '''  // Non-Claude hosts inline the section template content (monolith preserved).
            // Inner {{RESOLVER}} tokens are expanded by the generator's multi-pass resolve.
            const tmplPath = path.join(ROOT, ctx.skillName, 'sections', `${entry.file}.tmpl`);
            return fs.readFileSync(tmplPath, 'utf-8').trimEnd();
          };
          '''
          new = '''  if (ctx.host === 'codex') {
            const externalName = codexSkillDir(ctx.skillName);
            const globalPath = `$HOME/.codex/skills/${externalName}/sections/${entry.file}`;
            const localPath = `.agents/skills/${externalName}/sections/${entry.file}`;
            return [
              `> **STOP.** Before ${entry.trigger}, load the canonical section for this phase.`,
              `> Run \\`cat "${globalPath}"\\`. If that file is missing, run \\`cat "${localPath}"\\`.`,
              `> Execute the loaded section in full. Do not work from memory — it is the source of truth for this step.`,
            ].join('\\n');
          }

          // Remaining hosts inline the section template content (monolith preserved).
          // Inner {{RESOLVER}} tokens are expanded by the generator's multi-pass resolve.
          const tmplPath = path.join(ROOT, ctx.skillName, 'sections', `${entry.file}.tmpl`);
          return fs.readFileSync(tmplPath, 'utf-8').trimEnd();
          };
          '''
          if old not in s:
              raise SystemExit('SECTION inline anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace(
          ''' * Claude only; other hosts inline everything so an index would be noise.''',
          ''' * Progressive hosts only; inline hosts already carry the full section payload.''')
          s = s.replace("  if (ctx.host !== 'claude') return '';", "  if (!isProgressiveSectionHost(ctx)) return '';", 1)
          p.write_text(s)

          p = Path('scripts/gen-skill-docs.ts')
          s = p.read_text()
          old = '''    // ─── Section generation (v2 plan T9, Claude-first carve) ───
              // On-demand sections/*.md for carved skills. Generated for CLAUDE ONLY:
              // every other host inlines section content via the {{SECTION:id}} resolver
              // (keeping the full monolith skill), so they need no section files and we
              // sidestep host-portable section paths until that plumbing lands. No-op for
              // any skill without a sections/ dir. Mirrors the SKILL.md DRY_RUN handling so
              // sections participate in the freshness gate.
              for (const sec of currentHost === 'claude' ? discoverSectionTemplates(ROOT) : []) {
          '''
          new = '''    // ─── Section generation (v2 plan T9, progressive carve) ───
              // On-demand sections/*.md for carved skills. Claude and Codex keep these
              // payloads outside the always-loaded SKILL.md and read them only when the
              // relevant phase fires. Other hosts still inline section content.
              // No-op for any skill without a sections/ dir. Mirrors the SKILL.md DRY_RUN
              // handling so sections participate in the freshness gate.
              const generatesProgressiveSections = currentHost === 'claude' || currentHost === 'codex';
              for (const sec of generatesProgressiveSections ? discoverSectionTemplates(ROOT) : []) {
          '''
          if old not in s:
              raise SystemExit('section generation anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          Path('test/codex-progressive-sections.test.ts').write_text(r'''import { describe, test, expect } from 'bun:test';
          import { spawnSync } from 'child_process';
          import * as fs from 'fs';
          import * as os from 'os';
          import * as path from 'path';

          const ROOT = path.resolve(import.meta.dir, '..');
          const MARKER = 'These are non-negotiable. They shape every response in this mode.';

          function renderHost(host: 'codex' | 'factory'): string {
            const outDir = fs.mkdtempSync(path.join(os.tmpdir(), `gstack-${host}-sections-`));
            const result = spawnSync('bun', ['run', 'scripts/gen-skill-docs.ts', '--host', host, '--out-dir', outDir], {
              cwd: ROOT, encoding: 'utf-8', timeout: 120_000,
            });
            if (result.status !== 0) throw new Error(`${host} generation failed:\n${result.stderr || result.stdout}`);
            return outDir;
          }

          describe('Codex progressive section loading', () => {
            test('Codex defers Office Hours payload to a generated section', () => {
              const outDir = renderHost('codex');
              try {
                const base = path.join(outDir, '.agents', 'skills', 'gstack-office-hours');
                const skill = fs.readFileSync(path.join(base, 'SKILL.md'), 'utf-8');
                const section = fs.readFileSync(path.join(base, 'sections', 'phase-2a-startup-diagnostic.md'), 'utf-8');
                expect(skill).toContain('cat "$HOME/.codex/skills/gstack-office-hours/sections/phase-2a-startup-diagnostic.md"');
                expect(skill).toContain('cat ".agents/skills/gstack-office-hours/sections/phase-2a-startup-diagnostic.md"');
                expect(skill).not.toContain(MARKER);
                expect(section).toContain(MARKER);
              } finally {
                fs.rmSync(outDir, { recursive: true, force: true });
              }
            });

            test('Factory preserves current inline behavior', () => {
              const outDir = renderHost('factory');
              try {
                const base = path.join(outDir, '.factory', 'skills', 'gstack-office-hours');
                expect(fs.readFileSync(path.join(base, 'SKILL.md'), 'utf-8')).toContain(MARKER);
                expect(fs.existsSync(path.join(base, 'sections', 'phase-2a-startup-diagnostic.md'))).toBe(false);
              } finally {
                fs.rmSync(outDir, { recursive: true, force: true });
              }
            });
          });
          ''')
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run focused progressive-loading test
        run: bun test test/codex-progressive-sections.test.ts

      - name: Remove one-shot staging files
        run: |
          rm .icm-codex-progressive-context.patch
          rm .github/workflows/icm-codex-progressive-context.yml

      - name: Commit tested implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: load gstack sections progressively in Codex"
          git push origin HEAD:icm-codex-progressive-context
