name: ICM Codex Eager Context Audit

on:
  push:
    branches: [icm-codex-context-wave-2]
    paths:
      - scripts/audit-codex-eager-context.ts
      - .github/workflows/icm-eager-context-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Render head
        run: bun run scripts/gen-skill-docs.ts --host codex --out-dir /tmp/gstack-head
      - name: Render baseline main
        shell: bash
        run: |
          git worktree add /tmp/gstack-main origin/main
          cd /tmp/gstack-main
          bun install --frozen-lockfile
          bun run scripts/gen-skill-docs.ts --host codex --out-dir /tmp/gstack-main-render
      - name: Audit eager context
        run: bun scripts/audit-codex-eager-context.ts /tmp/gstack-main-render /tmp/gstack-head /tmp/icm-codex-eager-context-audit.md
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: icm-codex-eager-context-audit
          path: /tmp/icm-codex-eager-context-audit.md

# Registration nudge for the one-shot branch audit.
